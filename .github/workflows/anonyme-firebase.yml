name: Connexion anonyme Firebase
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  anonyme:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Tester puis activer la connexion anonyme des patients
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          K="AIzaSyCI7fwNeTl-2kYNnlpjr0IatLvQbppsUgg"
          t() { curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$K" -H "Content-Type: application/json" -d '{"returnSecureToken":true}' | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if 'idToken' in d else 'REFUS '+str(d.get('error',{}).get('message')))"; }
          { echo "== avant"; t; } > /tmp/out.txt
          if ! grep -q "^OK" /tmp/out.txt && [ -n "$FIREBASE_SA" ]; then
            pip -q install google-auth requests >/dev/null 2>&1
            printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
            python3 - "$RUNNER_TEMP/sa.json" >> /tmp/out.txt 2>&1 <<'PY'
          import sys, google.oauth2.service_account as sa, google.auth.transport.requests as tr, requests
          c = sa.Credentials.from_service_account_file(sys.argv[1], scopes=["https://www.googleapis.com/auth/cloud-platform", "https://www.googleapis.com/auth/firebase"])
          c.refresh(tr.Request())
          r = requests.patch("https://identitytoolkit.googleapis.com/admin/v2/projects/programme-kine/config?updateMask=signIn.anonymous.enabled",
                             headers={"Authorization": "Bearer " + c.token, "Content-Type": "application/json"}, json={"signIn": {"anonymous": {"enabled": True}}})
          print("== activation", r.status_code, r.text[:300].replace(c.token, "x"))
          PY
            rm -f "$RUNNER_TEMP/sa.json"
            { echo "== apres"; t; } >> /tmp/out.txt
          fi
          cat /tmp/out.txt
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git fetch -q origin diag || true
          git checkout -q -B diag && mkdir -p tools && cp /tmp/out.txt tools/anonyme.txt && git add tools/anonyme.txt && git commit -q -m "Anonyme [skip ci]" && git push -q -f origin diag
