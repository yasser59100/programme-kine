name: Regles Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SA: ${{ secrets.FIREBASE_SA != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      # Publication par l'API des règles (firebase-tools demandait des droits que le compte de service n'a pas)
      - name: Publier les regles Firestore
        if: env.HAS_SA == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          pip install -q google-auth requests >/dev/null 2>&1
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          set +e
          python3 - "$RUNNER_TEMP/sa.json" > /tmp/regles_log.txt 2>&1 <<'PY'
          import sys, requests, google.auth.transport.requests
          from google.oauth2 import service_account
          c = service_account.Credentials.from_service_account_file(sys.argv[1], scopes=["https://www.googleapis.com/auth/cloud-platform"])
          c.refresh(google.auth.transport.requests.Request()); h = {"Authorization": "Bearer " + c.token}
          B = "https://firebaserules.googleapis.com/v1/projects/programme-kine"
          loc = open("firestore.rules").read()
          rs = requests.post(B + "/rulesets", headers=h, json={"source": {"files": [{"name": "firestore.rules", "content": loc}]}})
          print("ruleset", rs.status_code, "" if rs.ok else rs.text[:400])
          if not rs.ok: sys.exit(1)
          up = requests.patch(B + "/releases/cloud.firestore", headers=h, json={"release": {"name": "projects/programme-kine/releases/cloud.firestore", "rulesetName": rs.json()["name"]}})
          print("release", up.status_code, "" if up.ok else up.text[:400])
          if not up.ok: sys.exit(1)
          r2 = requests.get(B + "/releases/cloud.firestore", headers=h).json()
          s2 = requests.get("https://firebaserules.googleapis.com/v1/" + r2["rulesetName"], headers=h).json()
          same = "".join(f["content"] for f in s2["source"]["files"]).strip() == loc.strip()
          print("en ligne identiques au fichier :", same)
          sys.exit(0 if same else 1)
          PY
          code=$?
          rm -f "$RUNNER_TEMP/sa.json"
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git fetch -q origin diag || true
          git checkout -q -B diag
          mkdir -p tools && cp /tmp/regles_log.txt tools/regles_log.txt && git add tools/regles_log.txt && git commit -q -m "Journal regles [skip ci]" && git push -q -f origin diag || true
          exit $code
      - if: env.HAS_SA != 'true'
        run: echo "Secret FIREBASE_SA pas encore ajouté."
