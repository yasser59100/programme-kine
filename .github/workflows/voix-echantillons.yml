name: Echantillons de voix
on:
  push:
    branches: [voix-echantillons]
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install piper-tts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generer
        run: |
          set -e
          mkdir -p out voices
          B=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR
          for v in siwis/medium/fr_FR-siwis-medium tom/medium/fr_FR-tom-medium upmc/medium/fr_FR-upmc-medium; do
            n=$(basename $v)
            curl -sSL -o voices/$n.onnx "$B/$v.onnx"
            curl -sSL -o voices/$n.onnx.json "$B/$v.onnx.json"
          done
          gen () { # voix, locuteur, nom
            python tools/voix_gen.py voices/$1.onnx "$2" $3
            # les 5 phrases a la suite, avec un silence entre chaque
            files=""; for k in 1 2 3 4 5; do files="$files -i out/$3_$k.wav"; done
            for k in 1 2 3 4 5; do ffmpeg -loglevel error -y -i out/$3_$k.wav -af apad=pad_dur=0.8 -ar 22050 out/$3_p$k.wav; done; files=""; for k in 1 2 3 4 5; do files="$files -i out/$3_p$k.wav"; done
            ffmpeg -loglevel error $files -filter_complex "[0][1][2][3][4]concat=n=5:v=0:a=1" -ar 44100 -b:a 128k out/$3.mp3
          }
          gen fr_FR-siwis-medium "" femme_siwis
          gen fr_FR-tom-medium "" homme_tom
          gen fr_FR-upmc-medium 1 homme_pierre
          gen fr_FR-upmc-medium 0 femme_jessica
          ls -la out/*.mp3
      - name: Ranger les echantillons dans la branche
        run: |
          mkdir -p tools/echantillons && cp out/*.mp3 tools/echantillons/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add tools/echantillons && git commit -m "Echantillons de voix generes [skip ci]" && git push
